<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Онлайн Школа Помощи</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <header>
        <h1>📚 Библиотека материалов</h1>
        <div id="filters">
            <button class="filter-btn" data-tag="анатомия">#анатомия</button>
            <button class="filter-btn" data-tag="физиология">#физиология</button>
            <button class="filter-btn" data-tag="фармакология">#фармакология</button>
            <button class="filter-btn" data-tag="патанатомия">#патанатомия</button>
            <button class="filter-btn" data-tag="конспект">#конспект</button>
            <button class="filter-btn" data-tag="видео">#видео</button>
            <button class="filter-btn" data-tag="реферат">#реферат</button>
            <button class="filter-btn" data-tag="комплекс">#комплекс</button>
            <button id="reset-filters" class="filter-btn reset">Сбросить</button>
        </div>
    </header>
    <main id="materials-list">
        <!-- Карточки загружаются через JavaScript -->
    </main>
</div>

<!-- Модальное окно -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
