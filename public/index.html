<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Онлайн Школа Помощи</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
    <header>
        <h1>📚 Библиотека</h1>
        <div id="filters-wrapper">
            <div id="filters">
                <button class="filter-chip" data-tag="анатомия">🧬 Анатомия</button>
                <button class="filter-chip" data-tag="физиология">❤️ Физиология</button>
                <button class="filter-chip" data-tag="фармакология">💊 Фармакология</button>
                <button class="filter-chip" data-tag="патанатомия">🔬 Патанатомия</button>
                <button class="filter-chip" data-tag="конспект">📄 Конспект</button>
                <button class="filter-chip" data-tag="видео">🎬 Видео</button>
                <button class="filter-chip" data-tag="реферат">📝 Реферат</button>
                <button class="filter-chip" data-tag="комплекс">📦 Комплекс</button>
                <button id="reset-filters" class="filter-chip reset">✕ Сбросить</button>
            </div>
            <div id="filter-slider"></div>
        </div>
    </header>
    <main id="materials-list">
        <!-- Карточки загружаются через JavaScript -->
    </main>
</div>

<!-- Модальное окно -->
<div id="modal" class="modal">
    <div class="modal-content glass">
        <span class="close">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
